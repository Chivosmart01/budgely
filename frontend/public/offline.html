<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgely — Offline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0B0F19;
      color: #F9FAFB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .container {
      max-width: 420px;
      background-color: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background-color: #10B981;
      color: #FFFFFF;
      font-size: 2rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 10px;
    }
    p {
      font-size: 0.95rem;
      color: #9CA3AF;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      background-color: #10B981;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">₦</div>
    <h1>You are Offline</h1>
    <p>Please check your internet connection. Budgely will reconnect automatically as soon as you are back online.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
